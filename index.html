<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دنیای ما</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>[hidden]{display:none!important}

/* Layout: one narrow phone-first column; splash, a home menu with four tiles, one panel per section. Palette: white, blush pink, sky blue. */
:root{
  --g1:#ffffff;--g2:#ffeaf2;--g3:#dff1ff;
  --card:#ffffffcc;--item:#ffffff;--field:#ffffff;--line:#f0d5e0;
  --pink:#f2578a;--sky:#2488d8;--text:#2f3b55;--muted:#677790;--btn-text:#ffffff;--danger:#d63a5f;
  --shadow:#f2578a26;--track:#2f3b551a;
  --font:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --g1:#1b2135;--g2:#2a2038;--g3:#1b2c45;
  --card:#2a3149cc;--item:#323a57;--field:#20263b;--line:#4a5578;
  --pink:#ff86ae;--sky:#6cc0ff;--text:#eef3fb;--muted:#a9b6cd;--btn-text:#1b2135;--danger:#ff7a99;
  --shadow:#00000040;--track:#ffffff22;color-scheme:dark}}
:root[data-theme="dark"]{
  --g1:#1b2135;--g2:#2a2038;--g3:#1b2c45;
  --card:#2a3149cc;--item:#323a57;--field:#20263b;--line:#4a5578;
  --pink:#ff86ae;--sky:#6cc0ff;--text:#eef3fb;--muted:#a9b6cd;--btn-text:#1b2135;--danger:#ff7a99;
  --shadow:#00000040;--track:#ffffff22;color-scheme:dark}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:var(--font);color:var(--text);background-color:var(--g1);
  background-image:linear-gradient(165deg,var(--g1) 0%,var(--g2) 48%,var(--g3) 100%);background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:22px 60px;line-height:1.7}
.wrap{max-width:560px;margin:0 auto}
#loader{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background-color:var(--g1);background-image:linear-gradient(165deg,var(--g1) 0%,var(--g2) 48%,var(--g3) 100%);transition:opacity .6s,visibility .6s}
#loader.hide{opacity:0;visibility:hidden}
.heart{font-size:64px;animation:beat 1s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.bar{width:180px;height:6px;border-radius:9px;background:var(--track);margin-top:22px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--sky));animation:load 2s forwards}
@keyframes load{to{width:100%}}
@media (prefers-reduced-motion:reduce){.heart{animation:none}.bar i{animation-duration:.01s}}
h1{font-size:26px;font-weight:800;text-align:center;margin:18px 0 4px;text-wrap:balance}
.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:24px}
.menu{display:grid;gap:14px}
.tile{background:var(--card);border-radius:22px;padding:20px;display:flex;align-items:center;gap:16px;cursor:pointer;
  box-shadow:0 8px 24px var(--shadow);transition:transform .15s;border:0;width:100%;font:inherit;color:inherit;text-align:right}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:36px}
.tile b{display:block;font-size:17px}
.tile span{font-size:13px;color:var(--muted)}
.back{background:var(--card);border:0;border-radius:14px;padding:8px 14px;font:inherit;cursor:pointer;margin-bottom:10px;color:var(--text)}
.box{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px var(--shadow)}
.box h2{font-size:17px;margin-bottom:12px}
.row{margin-bottom:14px}
.row label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
input[type=range]{width:100%;accent-color:var(--pink)}
.meter{height:12px;border-radius:9px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:9px;transition:width .5s}
.big{font-size:54px;text-align:center}
.mood{text-align:center;font-weight:600;margin:4px 0 10px}
input[type=text],input[type=time],input[type=url],textarea{font:inherit;color:var(--text);border:1.5px solid var(--line);
  background:var(--field);border-radius:12px;padding:10px;width:100%;min-width:0}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.btn{background:linear-gradient(90deg,var(--pink),var(--sky));color:var(--btn-text);border:0;border-radius:14px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
.x{background:none;border:0;font:inherit;font-size:18px;cursor:pointer;opacity:.7;color:var(--text);padding:4px}
.x.sure{color:var(--danger);font-size:13px;font-weight:600;opacity:1}
.item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--item);margin-bottom:8px}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item .t small{display:block;color:var(--muted);font-size:12px}
.time{font-weight:800;color:var(--sky);font-size:13px;white-space:nowrap;direction:ltr;text-align:center;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.grid2 small{color:var(--muted)}
.stamp{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.msg{color:var(--danger);font-size:13px;min-height:20px;margin-bottom:6px}
a{color:var(--sky);text-decoration:none;font-weight:600}

/* farm game */
.gbox{padding:12px}
.hud{display:flex;align-items:center;gap:12px;margin-bottom:8px;font-weight:600;font-size:14px;flex-wrap:wrap}
.hud .en{flex:1;min-width:80px;height:10px;border-radius:9px;background:var(--track);overflow:hidden}
.hud .en i{display:block;height:100%;width:100%;border-radius:9px;background:linear-gradient(90deg,var(--pink),var(--sky));transition:width .25s}
#gc{display:block;width:100%;height:auto;aspect-ratio:320/224;image-rendering:pixelated;border-radius:14px;background:#bfe8ae}
.gmsg{min-height:26px;margin-top:8px;font-size:14px;color:var(--text);text-align:center}
.inv{display:flex;gap:14px;justify-content:center;font-size:13px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.tools{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:12px}
.tool{border:1.5px solid var(--line);background:var(--item);color:var(--text);border-radius:12px;padding:6px 2px;font:inherit;font-size:11px;cursor:pointer;line-height:1.4;text-align:center}
.tool small{display:block;color:var(--muted);font-size:11px}
.tool.on{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink) inset}
.pad{display:flex;align-items:center;justify-content:space-between;gap:16px;direction:ltr}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;grid-template-areas:". u ." "l . r" ". d ."}
.dpad button,.act{touch-action:none;user-select:none;-webkit-user-select:none;border:0;border-radius:14px;background:var(--item);color:var(--text);font:inherit;font-size:18px;cursor:pointer;box-shadow:0 3px 10px var(--shadow)}
.dpad button:active,.act:active{background:var(--line)}
.act{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--sky));color:var(--btn-text);font-weight:800;font-size:16px;direction:rtl}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}

/* roles and login */
[data-role="him"] .only-her,[data-role="her"] .only-him{display:none!important}
#login{max-width:420px;margin:12vh auto 0}
#login input[type=password]{text-align:center;direction:ltr;letter-spacing:.12em;margin:10px 0 6px}
.chip{display:flex;gap:10px;align-items:center;justify-content:center;background:var(--card);border-radius:16px;padding:10px 14px;margin:-8px 0 18px;font-size:14px;box-shadow:0 8px 24px var(--shadow)}
.topstat{position:sticky;top:max(8px,env(safe-area-inset-top,0px));z-index:30;display:flex;gap:10px;align-items:center;justify-content:center;width:100%;border:0;font:inherit;color:var(--text);cursor:pointer;
  background:var(--item);border-radius:16px;padding:9px 14px;margin:0 0 14px;font-size:14px;font-weight:600;box-shadow:0 6px 20px var(--shadow);border:1.5px solid var(--line)}
.topstat{flex-wrap:wrap}
.topstat .e{font-size:20px}
.topstat .nt{flex-basis:100%;text-align:center;font-weight:400;font-size:13px;color:var(--muted);overflow-wrap:anywhere;line-height:1.6}
.topstat small{color:var(--muted);font-weight:400;font-size:12px}
body.gaming .topstat{display:none!important}
#homeChip{display:none!important}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;font-size:12px;color:var(--muted)}
.foot .x{font-size:13px;color:var(--muted)}
audio{width:100%;height:38px;margin-top:8px;display:block}
.file{display:block;border:1.5px dashed var(--line);border-radius:12px;padding:10px;margin-bottom:8px;font-size:13px;color:var(--muted);cursor:pointer}
.file input{display:block;margin-top:6px;max-width:100%;font:inherit;color:var(--text)}
.btn:disabled{opacity:.6;cursor:default}

/* game v2: fixed, non-scrolling layout */
body.gaming{position:fixed;inset:0;overflow:hidden;padding-block:8px;background-attachment:scroll}
body.gaming .wrap,body.gaming #app{height:100%}
#farm:not([hidden]){display:flex;flex-direction:column;gap:6px;height:100%}
#farm .back{align-self:flex-start;margin:0;padding:6px 12px}
.gbox{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;position:relative;margin:0;padding:10px}
.gbox .hud{margin:0}
.stage{flex:1;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
#gc{width:min(100cqw,calc(100cqh*14/17));height:min(calc(100cqw*17/14),100cqh);aspect-ratio:auto;flex:none}
.gbox .inv{margin:0;min-height:18px}
.gbox .gmsg{margin:0;min-height:22px;font-size:13px;line-height:1.5}
.tools{display:flex;grid-template-columns:none;gap:6px;overflow-x:auto;margin:0;padding-bottom:2px;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;min-width:62px}
.pad{gap:12px}
.dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,40px);gap:3px}
.act{width:84px;height:84px}
.btn.sm{padding:6px 12px;font-size:12px;white-space:nowrap}
.btn.ghost{background:var(--item);color:var(--text);border:1.5px solid var(--line)}
.pill{background:var(--track);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.shop{position:absolute;inset:0;background:#0000004d;border-radius:22px;display:flex;align-items:flex-end;justify-content:center;z-index:5}
.shop-card{background:var(--g1);width:100%;max-height:82%;overflow-y:auto;border-radius:22px;padding:14px;touch-action:pan-y}
.shop-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.shop-head b{flex:1;font-size:17px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;border:1.5px solid var(--line);background:var(--item);color:var(--text);border-radius:12px;padding:6px;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink) inset}

/* v3: fixed-height rows so the canvas never resizes when the message text changes */
.gbox .hud{flex-wrap:nowrap;flex:0 0 auto;height:24px;min-height:24px;overflow:hidden}
#hDay{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hCoin{flex:0 0 auto;white-space:nowrap}
.gbox .inv{flex:0 0 auto;height:20px;min-height:20px;overflow:hidden;flex-wrap:nowrap;white-space:nowrap}
.gbox .gmsg{flex:0 0 auto;height:38px;min-height:38px;line-height:19px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;text-align:center}
.gbox .tools{flex:0 0 auto;height:56px;min-height:56px;overflow-y:hidden}
.gbox .pad{flex:0 0 auto}
.tool{white-space:nowrap}
.tabs button{font-size:12px;padding:6px 2px}
.act{font-size:15px;line-height:1.3}

/* v4: farm screen only -> black background on every phone; the rest of the site keeps its pink/white/blue look */
html:has(body.gaming){background:#000}
body.gaming{
  background:#000 !important;background-image:none !important;
  --g1:#14141c;--g2:#14141c;--g3:#14141c;--card:#14141c;--item:#22222e;--field:#22222e;--line:#33334a;
  --track:#2c2c3c;--muted:#aaa6b8;--text:#f5eff7;--shadow:#00000099;color:#f5eff7;
}
body.gaming .gbox{background:#0d0d13;border:1px solid #23232f;box-shadow:none}
body.gaming #farm .back{background:#1b1b26;color:#f5eff7;box-shadow:none}
body.gaming .shop-card{background:#14141c;color:#f5eff7}
body.gaming .item{background:#1d1d28;border-color:#2c2c3a}
body.gaming .stage canvas,body.gaming #gc{border-radius:14px}

/* no copy / cut / select bubble when a button is held, and no browser menu on long press */
#farm,#farm *{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#farm button,#farm canvas{touch-action:manipulation}

/* nicer buttons */
.dpad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,42px);gap:4px}
.dpad button{border-radius:16px;background:linear-gradient(180deg,#2b2b3a,#1e1e2a);color:#f5eff7;font-size:19px;
  border:1px solid #3a3a4e;box-shadow:0 3px 0 #0a0a10,0 6px 14px #00000080;transition:transform .06s,box-shadow .06s,background .1s}
.dpad button:active{transform:translateY(3px);box-shadow:0 0 0 #0a0a10;background:linear-gradient(180deg,#3a3a52,#2a2a3c)}
.act{width:88px;height:88px;border:3px solid #ffffff22;box-shadow:0 4px 0 #6a2f58,0 8px 20px #ff6fa066;
  background:linear-gradient(135deg,var(--pink),var(--sky));transition:transform .06s,box-shadow .06s}
.act:active{transform:translateY(4px) scale(.97);box-shadow:0 0 0 #6a2f58,0 2px 10px #ff6fa066;background:linear-gradient(135deg,var(--pink),var(--sky))}
.tool{background:#1d1d28;border:1.5px solid #33334a;border-radius:14px;color:#f5eff7;min-width:68px;transition:transform .06s}
.tool:active{transform:scale(.95)}
.tool.on{background:#2a2036;border-color:var(--pink);box-shadow:0 0 0 2px var(--pink) inset,0 0 12px #ff6fa044}
.tool small{color:#b9b4c6}
.tabs button{background:#1d1d28;border-color:#33334a;color:#f5eff7;border-radius:14px}
.tabs button.on{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink) inset}
.shop .btn,.btn.sm{border-radius:12px}
</style>
</head>
<body>

<div id="loader"><div class="heart">🌸</div><p style="margin-top:14px;font-weight:600">در حال بارگذاری...</p><div class="bar"><i></i></div></div>

<div class="wrap" dir="rtl" lang="fa">

<section id="login" hidden>
  <h1>دنیای ما</h1>
  <div class="box">
    <div id="loginOnline">
      <p class="sub" style="margin-bottom:6px">کد ورودت رو وارد کن</p>
      <input type="password" id="pinIn" autocomplete="current-password" placeholder="کد ورود">
      <div class="msg" id="loginMsg"></div>
      <button class="btn" style="width:100%" id="loginBtn">ورود</button>
    </div>
    <div id="loginDemo" hidden>
      <p class="sub" style="margin-bottom:6px">حالت آزمایشی: هنوز به سرور وصل نیست و اطلاعات فقط روی همین مرورگر می‌مونه. ببین هر کدوم از دو نقش چی می‌بینه.</p>
      <div class="grid2">
        <button class="btn" data-demo="her">ورود به‌عنوان نانا</button>
        <button class="btn" data-demo="him">ورود به‌عنوان خودم</button>
      </div>
    </div>
  </div>
</section>

<div id="app" hidden>
<button type="button" class="topstat only-him" id="topStatus" onclick="go('vibe')" aria-live="polite" hidden></button>

<section id="home">
  <h1>دنیای ما</h1>
  <p class="sub" id="hello">سلام نانا</p>
  <div class="chip only-him" id="homeChip"></div>
  <div class="menu">
    <button class="tile" onclick="go('farm')"><div class="ic">🌱</div><div><b id="tFarm">مزرعه</b><span id="tFarmS">بکار، برداشت کن، ماهی بگیر</span></div></button>
    <button class="tile" onclick="go('vibe')"><div class="ic">🌈</div><div><b id="tVibe">وضعیت</b><span id="tVibeS">حال و انرژی امروز</span></div></button>
    <button class="tile" onclick="go('plan')"><div class="ic">🗓️</div><div><b id="tPlan">برنامه‌ی امروز</b><span id="tPlanS">کلاس‌ها و کارها به ترتیب ساعت</span></div></button>
    <button class="tile" onclick="go('music')"><div class="ic">🎧</div><div><b>پلی‌لیست</b><span>آهنگ‌های مشترک</span></div></button>
  </div>
  <button type="button" class="btn only-him" id="notifBtn2" style="width:100%;margin-top:14px">🔔 روشن کردن اعلان معمولی وضعیت نانا</button>
<button type="button" class="btn only-him" id="notifBtn" style="width:100%;margin-top:10px">🎵 روشن کردن اعلان رسانه‌ای (مثل آهنگ)</button>
<div class="foot"><span id="net"></span><button class="x" id="logoutBtn">خروج</button></div>
</section>

<section id="farm" hidden>
  <button class="back" onclick="go('home')">→ برگشت</button>
  <div class="box gbox">
    <div class="hud"><span id="hDay"></span><span id="hCoin"></span><span class="en" title="انرژی"><i id="hEn"></i></span></div>
    <div class="stage"><canvas id="gc" aria-label="مزرعه"></canvas></div>
    <div class="inv" id="hInv"></div>
    <div class="gmsg" id="hMsg" aria-live="polite"></div>
    <div class="tools" id="tools"></div>
    <div class="pad">
      <div class="dpad">
        <button data-d="u" style="grid-area:u" aria-label="بالا">▲</button>
        <button data-d="l" style="grid-area:l" aria-label="چپ">◀</button>
        <button data-d="r" style="grid-area:r" aria-label="راست">▶</button>
        <button data-d="d" style="grid-area:d" aria-label="پایین">▼</button>
      </div>
      <button class="act" id="actBtn">کار کن</button>
    </div>
    <div class="shop" id="shop" hidden>
      <div class="shop-card">
        <div class="shop-head"><b>فروشگاه</b><span id="shopCoin"></span><button class="x" id="shopClose" aria-label="بستن">✕</button></div>
        <div class="tabs"><button data-tab="seeds" class="on">بذر</button><button data-tab="decor">باغ</button><button data-tab="house">خونه</button><button data-tab="look">ظاهر</button><button data-tab="outfit">لباس</button></div>
        <div id="shopList"></div>
        <div class="msg" id="shopMsg" style="margin:6px 0 0"></div>
      </div>
    </div>
  </div>
</section>

<section id="vibe" hidden>
  <button class="back" onclick="go('home')">→ برگشت</button>
  <div class="box">
    <div class="big" id="vEmoji">🙂</div>
    <div class="mood" id="vText"></div>
    <div id="vMeters"></div>
    <div class="stamp" id="vStamp"></div>
  </div>
  <div class="box only-her">
    <h2>به‌روزرسانی وضعیت</h2>
    <div id="vSliders"></div>
    <textarea id="vNote" rows="2" placeholder="یه توضیح کوتاه (اختیاری)"></textarea>
    <button class="btn" style="margin-top:10px;width:100%" id="vSave">ذخیره</button>
  </div>
</section>

<section id="plan" hidden>
  <button class="back" onclick="go('home')">→ برگشت</button>
  <div class="box"><h2 id="planH">برنامه‌ی امروز</h2><div id="planList"></div></div>
  <div class="box only-her">
    <h2>افزودن یا ویرایش</h2>
    <input type="text" id="pTitle" placeholder="عنوان (مثلاً کلاس زبان)" style="margin-bottom:8px">
    <div class="grid2"><div><small>از ساعت</small><input type="time" id="pFrom"></div><div><small>تا ساعت</small><input type="time" id="pTo"></div></div>
    <input type="text" id="pNote" placeholder="توضیح (اختیاری)" style="margin-bottom:10px">
    <div class="msg" id="pMsg"></div>
    <button class="btn" style="width:100%" id="pBtn">افزودن</button>
  </div>
</section>

<section id="music" hidden>
  <button class="back" onclick="go('home')">→ برگشت</button>
  <div class="box"><h2>پلی‌لیست</h2><div id="songList"></div></div>
  <div class="box">
    <h2>آهنگ جدید</h2>
    <input type="text" id="sTitle" placeholder="اسم آهنگ" style="margin-bottom:8px">
    <input type="text" id="sArtist" placeholder="خواننده" style="margin-bottom:8px">

/* ---------- live link: positions, kisses and world edits go over a broadcast channel (no database writes) ---------- */
const Net=(()=>{
  const subs=[];let ws=null,joined=false,ref=0,hbT=null,rcT=null,bc=null,started=false;
  const room='nana-'+String(CFG.url||'local').replace(/^https?:\/\//,'').split('.')[0];
  const topic='realtime:'+room;
  const emit=m=>subs.forEach(f=>{try{f(m)}catch(e){}});
  const raw=o=>{if(ws&&ws.readyState===1){ws.send(JSON.stringify(o));return true}return false};
  function drop(){
    clearInterval(hbT);joined=false;
    if(ws){const w=ws;ws=null;try{w.onclose=w.onerror=w.onmessage=w.onopen=null;w.close()}catch(e){}}
    if(!rcT)rcT=setTimeout(()=>{rcT=null;connect()},2500);
  }
  function connect(){
    if(!ONLINE||ws)return;
    try{ws=new WebSocket(CFG.url.replace(/^http/,'ws').replace(/\/$/,'')+'/realtime/v1/websocket?apikey='+encodeURIComponent(CFG.anon)+'&vsn=1.0.0')}
    catch(e){ws=null;drop();return}
    ws.onopen=()=>{
      raw({topic,event:'phx_join',payload:{config:{broadcast:{self:false,ack:false},presence:{key:''},private:false},access_token:CFG.anon},ref:String(++ref),join_ref:'1'});
      clearInterval(hbT);hbT=setInterval(()=>raw({topic:'phoenix',event:'heartbeat',payload:{},ref:String(++ref)}),25000);
    };
    ws.onmessage=ev=>{
      let m;try{m=JSON.parse(ev.data)}catch(e){return}
      if(m.topic!==topic)return;
      if(m.event==='phx_reply'&&!joined&&m.payload&&m.payload.status==='ok'){joined=true;emit({t:'_up'})}
      else if(m.event==='broadcast'&&m.payload&&m.payload.payload)emit(m.payload.payload);
      else if(m.event==='phx_close'||m.event==='phx_error')drop();
    };
    ws.onclose=ws.onerror=drop;
  }
  return{
    on:f=>subs.push(f),
    start(){
      if(started)return;started=true;
      if(ONLINE)connect();
      else if('BroadcastChannel' in window){bc=new BroadcastChannel('dunya-ma-demo');bc.onmessage=e=>emit(e.data);setTimeout(()=>emit({t:'_up'}),300)}
      document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ONLINE&&!ws)connect()});
    },
    send(m){
      m.f=ROLE;
      if(ONLINE)return joined&&raw({topic,event:'broadcast',payload:{type:'broadcast',event:'m',payload:m},ref:String(++ref)});
      if(bc){bc.postMessage(m);return true}
      return false;
    },
    live:()=>ONLINE?joined:!!bc
  };
})();

function upload(file){
 return new Promise((res,rej)=>{
  const ext=((file.name.match(/\.[a-z0-9]{1,5}$/i)||['.mp3'])[0]).toLowerCase();
  const name=Date.now()+'-'+Math.random().toString(36).slice(2,8)+ext;
  const x=new XMLHttpRequest();
  x.open('POST',CFG.url.replace(/\/$/,'')+'/storage/v1/object/songs/'+name);
  const h=hdr();delete h['Content-Type'];Object.keys(h).forEach(k=>x.setRequestHeader(k,h[k]));
  x.setRequestHeader('Content-Type',file.type||'audio/mpeg');
  x.upload.onprogress=e=>{if(e.lengthComputable)$('sMsg').style.color='var(--muted)',$('sMsg').textContent='در حال آپلود... '+fa(Math.round(e.loaded/e.total*100))+'٪'};
  x.onload=()=>x.status<300?res(CFG.url.replace(/\/$/,'')+'/storage/v1/object/public/songs/'+name):rej(new Error(x.responseText));
  x.onerror=()=>rej(new Error('network'));
  x.send(file);
 });
}

const MAP=[];
(function build(){
  let seed=7;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  for(let y=0;y<H;y++)MAP.push(Array(W).fill('.'));
  const rect=(c,x,y,w,h)=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)MAP[j][i]=c};
  rect('P',6,7,1,12);rect('P',6,18,31,1);rect('P',36,7,1,12);rect('P',29,6,1,13);
  rect('H',4,4,5,3);MAP[6][6]='D';
  rect('S',28,4,3,2);
  rect('B',34,4,5,3);MAP[6][36]='Q';
  rect('f',12,7,12,9);
  rect('W',27,21,10,7);[[27,21],[36,21],[27,27],[36,27]].forEach(([x,y])=>MAP[y][x]='.');
  const keep=[[3,3,8,6],[11,6,14,11],[27,3,5,5],[33,3,7,6],[26,20,12,9],[5,6,3,14],[5,17,33,3]];
  const inKeep=(x,y)=>keep.some(([a,b,w,h])=>x>=a&&x<a+w&&y>=b&&y<b+h);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const edge=Math.min(x,y,W-1-x,H-1-y);
    if(edge<2){MAP[y][x]='T';continue}
    if(MAP[y][x]!=='.'||inKeep(x,y))continue;
    const p=edge<6?0.28:0.055;
    if(rnd()<p)MAP[y][x]='T';
  }
  [[10,10],[7,8],[8,9],[9,10]].forEach(([x,y])=>{if(MAP[y][x]==='T')MAP[y][x]='.'});
})();
const mapAt=(x,y)=>(y<0||y>=H||x<0||x>=W)?'T':MAP[y][x];

let lastSent='',lastSentAt=0,lastKiss=0;
function sendPos(force){
  if(!ROLE)return;
  const m={t:'pos',x:P.x,y:P.y,d:P.dir,s:scene,q:P.sit?1:0};
  const k=[m.x,m.y,m.d,m.s,m.q].join(),now=Date.now();
  if(!force&&k===lastSent&&now-lastSentAt<3000)return;
  lastSent=k;lastSentAt=now;Net.send(m);
}
function sendPl(){Net.send({t:'pl',lk:S.look,sl:S.sleepUntil})}
setInterval(()=>{if(ROLE&&!$('farm').hidden)sendPos()},200);
Net.on(m=>{
  if(!m||!ROLE||m.f===ROLE)return;
  if(m.t==='_up'){sendPl();sendPos(true);Net.send({t:'who'})}
  else if(m.t==='who'){sendPl();sendPos(true)}
  else if(m.t==='pos'){
    const far=Math.abs(m.x-O.x)+Math.abs(m.y-O.y)>2;
    if(!O.has||m.s!==O.scene||far){O.x=O.px=m.x;O.y=O.py=m.y;O.anim=1}
    else if(m.x!==O.x||m.y!==O.y){O.px=O.x;O.py=O.y;O.x=m.x;O.y=m.y;O.anim=0;O.par^=1}
    O.dir=m.d;O.scene=m.s;O.sit=m.q?1:0;O.has=1;O.seen=Date.now();
  }
  else if(m.t==='pl'){O.look=m.lk||{};O.sleepUntil=Math.min(m.sl||0,Date.now()+SLEEP);O.seen=Date.now()}
  else if(m.t==='world'){if(newer({rev:m.rev}))applyWorld(Object.assign({},m.w,{rev:m.rev}))}
  else if(m.t==='kiss'){
    const same=O.has&&O.scene===scene;
    const mx=(P.x+(same?O.x:P.x))/2*TS+4,my=(P.y+(same?O.y:P.y))/2*TS-6;
    kissFx(mx,my);
    if(P.anim>=1&&oVisible()){const dx=O.x-P.x,dy=O.y-P.y;if(Math.abs(dx)+Math.abs(dy)===1)P.dir=dx>0?'r':dx<0?'l':dy>0?'d':'u'}
    say('💋 '+otherName()+' تو رو بوسید');
  }

});

function itemAct(it,k,fx,fy){
  const d=ITEM[it];
  if(tool==='pick'||(tool==='hoe'&&!d.sit&&!d.use))return pickUp(fx,fy);
  if(d.sit)return P.anim>=1?sitOn(fx,fy):undefined;
  if(d.use)return useItem(it,k);
  say(`این‌جا ${d.n} هست. با «جمع‌کن» برش دار.`);
}
function place(fx,fy,ch){
  if(S.items[tool]<1)return;
  if(ch!=='.')return say('این‌جا جای وسیله نیست. یه جای خالی پیدا کن.');
  if(scene==='in'&&fx===6&&fy>=9)return say('جلوی در رو خالی بذار 🚪');
  if(otherAt(fx,fy)||(scene==='out'&&cat.x===fx&&cat.y===fy))return say('الان این‌جا کسی هست');
  itemMap()[fx+','+fy]=tool;S.items[tool]--;
  say(`${ITEM[tool].n} رو گذاشتی`);renderTools();store();
}
function actIn(fx,fy){
  const ch=tileAt(fx,fy),k=fx+','+fy;
  if(ch==='B')return goSleep();
  const it=S.hdecor[k];if(it)return itemAct(it,k,fx,fy);
  if(ch==='K')return say('یه قفسه‌ی کتاب 📚');
  if(ch==='Q')return say('یه گلدون 🪴');
  if(ch==='T')return say('میز ناهارخوری');
  if(DECOR[tool])return say('این وسیله مال بیرون، روی چمنه 🌿');
  if(HDECOR[tool])return place(fx,fy,ch);
  say('برای بیرون رفتن از در پایین برو. وسیله‌ی خونه رو از فروشگاه می‌خری 🛍️');
}
function actOut(fx,fy){
  const ch=tileAt(fx,fy),k=fx+','+fy;
  if(cat.x===fx&&cat.y===fy)return petCat();
  if(ch==='D')return enterHouse();
  const it=S.decor[k];if(it)return itemAct(it,k,fx,fy);
  if(ch==='Q')return openShop();
  if(ch==='S')return sell();
  if(ch==='W')return fish();
  if(ch==='f')return farmAct(fx,fy);
  if(HDECOR[tool])return say('این وسیله مال داخل خونه‌ست 🏠');
  if(DECOR[tool])return place(fx,fy,ch);
  say('این‌جا کاری نمی‌شه کرد.');
}
function act(){
  if(!$('shop').hidden)return;
  if(S.sleepUntil>Date.now())return say(`خوابیده‌ای 😴 ${fmt(S.sleepUntil-Date.now())} تا بیدار شدن`);
  const [fx,fy]=faceTile();
  if(otherAt(fx,fy))return kiss();
  if(scene==='in')return actIn(fx,fy);
  actOut(fx,fy);
}
function actLabel(){
  if(S.sleepUntil>Date.now())return 'خواب 😴';
  const [fx,fy]=faceTile();
  if(otherAt(fx,fy))return 'بوس 💋';
  const it=itemAtTile(fx,fy);
  if(scene==='in'&&tileAt(fx,fy)==='B')return 'بخواب';
  if(it&&ITEM[it]){if(tool==='pick')return 'جمع کن';if(ITEM[it].sit)return 'بشین';if(ITEM[it].use)return 'استفاده'}
  return 'کار کن';
}
$('actBtn').addEventListener('click',act);

/* ----- shop ----- */
let shopTab='seeds';
function openShop(){$('shop').hidden=false;shopTab='seeds';renderShop();say('')}
function closeShop(){$('shop').hidden=true}
function wearAcc(k,force){
  if(S.look[k]&&!force){S.look[k]=0;return}
  for(const j in LOOKS)if(LOOKS[j].slot===LOOKS[k].slot)S.look[j]=0;
  S.look[k]=1;
}
function renderShop(){
  $('shopCoin').textContent='🪙 '+fa(S.coins)+' (مشترک)';
  document.querySelectorAll('#shop [data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===shopTab));
  const row=(ic,n,sub,btn)=>`<div class="item"><div style="font-size:24px">${ic}</div><div class="t"><b>${n}</b><small>${sub}</small></div>${btn}</div>`;
  let h='';
  if(shopTab==='seeds'){
    h=Object.keys(CROPS).map(k=>{const c=CROPS[k],own=S.unlocked[k];
      return row(c.e,c.n,`${fa(c.days)} روز تا رسیدن · بذر ${fa(c.seed)} 🪙 · فروش ${fa(c.sell)} 🪙`,own?'<span class="pill">باز شده</span>':`<button class="btn sm" data-buy="unlock:${k}">باز کردن · ${fa(c.unlock)} 🪙</button>`)}).join('');
  }else if(shopTab==='decor'||shopTab==='house'){
    const cl=shopTab==='decor'?DECOR:HDECOR;
    h=`<div class="stamp" style="margin:0 0 8px">${shopTab==='decor'?'این‌ها رو بیرون، روی چمن بذار':'این‌ها رو توی خونه بذار'} · با «جمع‌کن» برشون دار</div>`
     +Object.keys(cl).map(k=>{const d=cl[k];
      return row(d.ic,d.n,(d.sit?'می‌شه روش نشست · ':d.use?'قابل استفاده · ':'')+'داری: '+fa(S.items[k]),`<button class="btn sm" data-buy="decor:${k}">${fa(d.price)} 🪙</button>`)}).join('');
  }else if(shopTab==='look'){
    h=Object.keys(LOOKS).map(k=>{const l=LOOKS[k],own=S.own[k];
      return row(l.ic,l.n,own?(S.look[k]?'پوشیده‌ای':'داری'):'مال خودته، هر کس برای خودش می‌خره',own?`<button class="btn sm ghost" data-buy="wear:${k}">${S.look[k]?'درآر':'بپوش'}</button>`:`<button class="btn sm" data-buy="look:${k}">${fa(l.price)} 🪙</button>`)}).join('');
  }else{
    h=Object.keys(OUTFITS).map(k=>{const o=OUTFITS[k],own=S.own['o_'+k];
      return row(o.ic,o.n,own?(S.look.outfit===k?'تنته':'داری'):'رنگ لباس عوض می‌شه',own?`<button class="btn sm ghost" data-buy="wearo:${k}">${S.look.outfit===k?'درآر':'بپوش'}</button>`:`<button class="btn sm" data-buy="outfit:${k}">${fa(o.price)} 🪙</button>`)}).join('');
  }
  $('shopList').innerHTML=h;
}
$('shop').addEventListener('click',e=>{
  if(e.target.id==='shopClose'||e.target.id==='shop'){closeShop();return}
  const t=e.target.closest('[data-tab]');if(t){shopTab=t.dataset.tab;renderShop();$('shopMsg').textContent='';return}
  const b=e.target.closest('[data-buy]');if(!b)return;
  const [type,k]=b.dataset.buy.split(':');const m=$('shopMsg');m.textContent='';
  const pay=n=>{if(S.coins<n){m.textContent='سکه‌ت کافی نیست.';return false}S.coins-=n;return true};
  if(type==='unlock'){if(pay(CROPS[k].unlock)){S.unlocked[k]=1;m.textContent=CROPS[k].n+' باز شد. توی نوار ابزار پایین پیداش می‌کنی.'}}
  if(type==='decor'){if(pay(ITEM[k].price)){S.items[k]++;m.textContent=ITEM[k].n+' خریده شد. توی نوار ابزار پیداش می‌کنی.'}}
  if(type==='look'){if(pay(LOOKS[k].price)){S.own[k]=1;wearAcc(k,true);m.textContent=LOOKS[k].n+' خریده شد و پوشیدی.'}}
  if(type==='wear'){wearAcc(k)}
  if(type==='outfit'){if(pay(OUTFITS[k].price)){S.own['o_'+k]=1;S.look.outfit=k;m.textContent=OUTFITS[k].n+' خریده شد و پوشیدی.'}}
  if(type==='wearo'){S.look.outfit=S.look.outfit===k?0:k}
  hud();renderTools();renderShop();store();sendPl();
});
$('shopClose').addEventListener('click',closeShop);

const held={u:0,d:0,l:0,r:0};
const KEYMAP={ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r'};
addEventListener('keydown',e=>{

  if(!$('shop').hidden){if(e.code==='Escape')closeShop();return}
  const d=KEYMAP[e.code];
  if(d){held[d]=1;e.preventDefault();return}
  if(e.code==='Space'||e.code==='Enter'||e.code==='KeyE'){if(!e.repeat)act();e.preventDefault();return}
  const m=/^Digit([1-9])$/.exec(e.code);if(m){const l=toolList();if(l[m[1]-1])setTool(l[m[1]-1])}
});
addEventListener('keyup',e=>{const d=KEYMAP[e.code];if(d)held[d]=0});
addEventListener('blur',()=>{for(const k in held)held[k]=0});
addEventListener('contextmenu',e=>{if(!$('farm').hidden)e.preventDefault()});
addEventListener('selectstart',e=>{if(!$('farm').hidden&&!/INPUT|TEXTAREA/.test(e.target.tagName||''))e.preventDefault()});
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
$('actBtn').addEventListener('pointerdown',buzz);
document.querySelectorAll('.dpad [data-d]').forEach(b=>{
  const d=b.dataset.d;

function tryMove(d){
  if(S.sleepUntil>Date.now())return;
  if(!$('shop').hidden)return;
  P.dir=d;if(P.anim<1)return;
  const [dx,dy]=VEC[d];const nx=P.x+dx,ny=P.y+dy;
  if(scene==='in'&&tileAt(nx,ny)==='E'){exitHouse();return}
  if(blocked(nx,ny))return;
  P.px=P.x;P.py=P.y;P.x=nx;P.y=ny;P.anim=0;P.par^=1;P.sit=0;posDirty=true;
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function camTarget(){
  if(scene==='in')return[0,-(VH-RH)*TS/2];
  const a=P.anim,x=(P.px+(P.x-P.px)*a)*TS+8,y=(P.py+(P.y-P.py)*a)*TS+8;
  return[clamp(x-VW*TS/2,0,W*TS-VW*TS),clamp(y-VH*TS/2,0,H*TS-VH*TS)];
}
function snapCam(){const[x,y]=camTarget();cam.x=x;cam.y=y}
let tickAt=0,lblAt=0,lastLbl='';
function update(dt,now){
  if(now-tickAt>1000){tickAt=now;const was=S.sleepUntil;tick();if(was&&!S.sleepUntil)hud()}
  if(P.anim<1)P.anim=Math.min(1,P.anim+dt/STEP_MS);
  if(O.anim<1)O.anim=Math.min(1,O.anim+dt/STEP_MS);
  if(P.anim>=1){const d=['u','d','l','r'].find(k=>held[k]);if(d)tryMove(d)}
  if(posDirty&&P.anim>=1&&!['u','d','l','r'].some(k=>held[k])){posDirty=false;savePos()}
  cat.t+=dt;if(cat.hop>0)cat.hop=Math.max(0,cat.hop-dt);
  if(cat.anim<1)cat.anim=Math.min(1,cat.anim+dt/420);
  if(cat.t>1500&&cat.anim>=1){cat.t=0;
    if(Math.random()<0.55){
      const dd=['u','d','l','r'][Math.floor(Math.random()*4)],v=VEC[dd];
      const nx=cat.x+v[0],ny=cat.y+v[1],ch=mapAt(nx,ny);
      const dc=S.decor[nx+','+ny];
      const free=!'THDSWBQ'.includes(ch)&&!(dc&&DECOR[dc]&&DECOR[dc].block)&&!(scene==='out'&&P.x===nx&&P.y===ny)&&!(scene==='out'&&P.px===nx&&P.py===ny&&P.anim<1)&&!(scene==='out'&&otherAt(nx,ny));
      if(free){cat.px=cat.x;cat.py=cat.y;cat.x=nx;cat.y=ny;cat.anim=0;cat.dir=dd}
    }}
  for(let i=hearts.length-1;i>=0;i--){hearts[i].t+=dt;if(hearts[i].t>1300)hearts.splice(i,1)}
  const[tx,ty]=camTarget();const k=Math.min(1,dt/110);cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;
  if(now-lblAt>150){lblAt=now;const l=actLabel();if(l!==lastLbl){lastLbl=l;$('actBtn').textContent=l}}
}


/* ----- drawing ----- */
const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};
const Hh=(x,y)=>(((x*73856093)^(y*19349663))>>>0);
const OUT='#4a2f3f';
function nightAlpha(){
  const d=new Date(),hr=d.getHours()+d.getMinutes()/60;
  return hr>=5&&hr<18?0:hr>=18&&hr<21?(hr-18)/3*.42:(hr>=21||hr<4)?.42:(5-hr)*.42;
}
const isNight=()=>nightAlpha()>0.15;

function ground(t,x0,y0,x1,y1){
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const ch=mapAt(x,y),px=x*TS,py=y*TS,h=Hh(x,y);
    if(ch==='W'){
      R(px,py,TS,TS,(x+y)%2?'#8ed4fb':'#86cdf6');
      const ph=(Math.floor(t/600)+x+y*2)%3;
      R(px+3+ph*3,py+5,4,1,'#cdeeff');R(px+9-ph*2,py+11,4,1,'#cdeeff');
      if(h%9===0){R(px+5,py+8,4,3,'#58b86a');R(px+6,py+8,2,1,'#7bd98a')}
      continue;
    }
    if(ch==='P'){
      R(px,py,TS,TS,'#f2dfca');
      if(h%3===0)R(px+h%12+1,py+(h>>4)%12+2,3,2,'#e3c7a8');
      if(h%5===0)R(px+(h>>3)%12+1,py+(h>>5)%12+1,2,1,'#fff3e2');
      continue;
    }
    const f=ch==='f';
    R(px,py,TS,TS,f?((x+y)%2?'#cdeaa4':'#c4e49a'):((x+y)%2?'#bfe8ae':'#b5e1a3'));
    if(h%5===0)R(px+h%11+2,py+(h>>3)%11+3,1,3,'#9fd18c');
    if(h%7===0)R(px+(h>>4)%10+3,py+(h>>6)%10+4,3,1,'#a6d994');
    if(h%13===0&&!f){const c=['#ffffff','#ff9fc3','#8fd0ff'][h%3];const fx=px+(h>>4)%11+2,fy=py+(h>>6)%11+2;R(fx,fy,2,2,c);R(fx,fy,1,1,'#ffe36e')}
    if(!f){
      if(mapAt(x,y-1)==='W')R(px,py,TS,3,'#f3e3b8');
      if(mapAt(x,y+1)==='W')R(px,py+TS-3,TS,3,'#f3e3b8');
      if(mapAt(x-1,y)==='W')R(px,py,3,TS,'#f3e3b8');
      if(mapAt(x+1,y)==='W')R(px+TS-3,py,3,TS,'#f3e3b8');
    }
  }
}
function crop(px,py,c,t){
  const cr=CROPS[c.c],f=Math.min(1,grown(c)/(cr.days*DAY)),mature=f>=1;
  if(f<0.12){R(px+6,py+9,2,2,'#f1dfbd');R(px+9,py+11,2,2,'#f1dfbd');return}
  const h=3+Math.round(f*6);
  if(c.c==='wheat'){
    for(let i=0;i<3;i++){const x=px+4+i*3;R(x,py+13-h,1,h,mature?'#d9a93a':'#58b86a');if(mature){R(x-1,py+13-h-2,3,3,'#f2cd5b');R(x,py+13-h-3,1,1,'#fff2a8')}}
    return;
  }
  R(px+7,py+13-h,2,h,'#43a85a');
  R(px+4,py+13-h+2,3,2,'#5ccf72');R(px+9,py+13-h+3,3,2,'#5ccf72');
  if(!mature)return;
  if(c.c==='carrot'){R(px+5,py+11,6,3,'#ff9a3c');R(px+6,py+10,4,1,'#ffb36a')}
  else if(c.c==='straw'){R(px+4,py+7,3,3,'#ff4f6d');R(px+9,py+8,3,3,'#ff4f6d');R(px+6,py+4,3,3,'#ff4f6d');R(px+5,py+7,1,1,'#fff');R(px+10,py+8,1,1,'#fff')}
  else{R(px+4,py+2,8,6,'#ff7fae');R(px+6,py+1,4,2,'#ff9cc2');R(px+7,py+4,2,2,'#fff')}
  if(Math.floor(t/400)%2)R(px+12,py+2,1,1,'#fff');
}
function fields(t,x0,y0,x1,y1){
  for(const k in S.soil){const c=S.soil[k];if(!c.t)continue;
    const [x,y]=k.split(',').map(Number);if(x<x0||x>x1||y<y0||y>y1)continue;
    const px=x*TS,py=y*TS,wet=c.c&&c.wa&&Date.now()-c.wa<DAY;
    R(px+1,py+1,14,14,wet?'#8f5e3e':'#c68c5f');
    R(px+3,py+5,10,1,wet?'#7a4e32':'#b57a50');R(px+3,py+10,10,1,wet?'#7a4e32':'#b57a50');
    if(c.c)crop(px,py,c,t);
  }
}

function char(px,py,dir,sw,par,gender,look,bob){

const HEART=[".XX.XX.","XXXXXXX","XXXXXXX",".XXXXX.","..XXX..","...X..."];
function heart(px,py,a){
  ctx.globalAlpha=a;
  HEART.forEach((row,j)=>{for(let i=0;i<7;i++)if(row[i]==='X')R(px+i,py+j,1,1,'#ff4f7b')});
  R(px+1,py+1,1,1,'#ffb3c6');ctx.globalAlpha=1;
}
function butterflies(t){
  [[16,6,'#ff9fc3'],[22,9,'#8fd0ff'],[14,13,'#ffffff']].forEach(([bx,by,c],i)=>{
    const x=bx*TS+Math.sin(t/900+i*2)*30+20,y=by*TS+Math.cos(t/700+i)*14,f=Math.floor(t/140+i)%2;
    R(Math.round(x),Math.round(y),2,2,c);R(Math.round(x)-1+f,Math.round(y)-1,1,1,c);R(Math.round(x)+2-f,Math.round(y)-1,1,1,c)});

function drawChar(e,gender,t,look){
  const moving=e.anim<1,a=e.anim;
  const x=(e.px+(e.x-e.px)*a)*TS,y=(e.py+(e.y-e.py)*a)*TS;
  const sw=moving?Math.sin(a*Math.PI):0;
  let bob=moving&&sw>0.7?1:0;
  if(e.sit){const it=seatKind(e.x,e.y);bob=it?ITEM[it].sit[1]:0}
  char(Math.round(x),Math.round(y),e.dir,e.sit?0:sw,e.par,gender,look,bob);
}
function drawFx(){
  hearts.forEach(h=>{
    if(h.t<0||h.sc!==scene)return;
    const x=Math.round(h.x),y=Math.round(h.y-h.t/1000*20),a=Math.max(0,1-h.t/1300);
    if(!h.k||h.k==='h')heart(x,y,a);
    else{ctx.globalAlpha=a;ctx.fillStyle='#6a5acd';ctx.font=(h.k==='k'?'10px':'9px')+' sans-serif';ctx.fillText(h.k==='k'?'💋':'♪',x,y+8);ctx.globalAlpha=1}
  });
}
const asleepView=()=>S.sleepUntil>Date.now();
function entY(e){return (e.py+(e.y-e.py)*e.anim)*TS+8+(e.sit?4:0)}
function drawOutside(t){
  const x0=Math.max(0,Math.floor(cam.x/TS)-1),y0=Math.max(0,Math.floor(cam.y/TS)-1),x1=Math.min(W-1,x0+VW+2),y1=Math.min(H-1,y0+VH+3);
  ctx.save();ctx.translate(-Math.round(cam.x),-Math.round(cam.y));
  ground(t,x0,y0,x1,y1);fields(t,x0,y0,x1,y1);
  const night=isNight();
  house(night);stall();shopBuilding(night);
  if(!asleepView()){const [dx,dy]=VEC[P.dir],fx=P.x+dx,fy=P.y+dy;
    if(P.anim>=1&&mapAt(fx,fy)!=='T'){ctx.strokeStyle='#f2578a';ctx.lineWidth=1;ctx.strokeRect(fx*TS+.5,fy*TS+.5,TS-1,TS-1)}}
  const ents=[];
  for(let y=y0;y<=Math.min(H-1,y1+2);y++)for(let x=x0;x<=x1;x++){
    if(MAP[y][x]==='T')ents.push([y*TS,()=>tree(x*TS,y*TS,x,y,t)]);
    const d=S.decor[x+','+y];if(d)ents.push([y*TS+(FLAT[d]?-4:0),()=>itemSprite(d,x*TS,y*TS,t,x+','+y)]);
  }
  const hop=cat.hop>0?-Math.round(Math.sin(cat.hop/350*Math.PI)*3):0;
  const ca=cat.anim,cx=(cat.px+(cat.x-cat.px)*ca)*TS,cy=(cat.py+(cat.y-cat.py)*ca)*TS;
  ents.push([cy+8,()=>catSprite(Math.round(cx),Math.round(cy)+hop,ca<1,t,cat.dir)]);
  if(!asleepView())ents.push([entY(P),()=>{drawChar(P,gSelf(),t,S.look);if(P.sit&&P.anim>=1)seatFront(P.x,P.y)}]);
  if(oVisible())ents.push([entY(O),()=>{drawChar(O,gOther(),t,O.look);if(O.sit&&O.anim>=1)seatFront(O.x,O.y)}]);
  ents.sort((p,q)=>p[0]-q[0]).forEach(e=>e[1]());
  butterflies(t);
  drawFx();
  ctx.restore();
  const dark=nightAlpha();
  if(dark>0){
    ctx.fillStyle=`rgba(40,60,130,${dark})`;ctx.fillRect(0,0,cv.width,cv.height);
    ctx.save();ctx.translate(-Math.round(cam.x),-Math.round(cam.y));
    ctx.globalCompositeOperation='lighter';
    for(const k in S.decor){if(S.decor[k]!=='lamp'&&S.decor[k]!=='campfire')continue;const [x,y]=k.split(',').map(Number);
      const g=ctx.createRadialGradient(x*TS+8,y*TS+4,2,x*TS+8,y*TS+4,36);g.addColorStop(0,'rgba(255,220,120,.55)');g.addColorStop(1,'rgba(255,220,120,0)');
      ctx.fillStyle=g;ctx.fillRect(x*TS-30,y*TS-34,76,76)}
    ctx.restore();
  }
}

}
function drawBed(t,herSl,himSl,herLook,himLook){
  R(TS,TS-2,64,6,'#a56f4f');R(TS,TS+2,64,30,'#c98f6b');
  [0,32].forEach(o=>{R(TS+o+2,TS+6,28,24,'#ffffff');R(TS+o+4,TS+8,11,6,'#ffe9f1')});
  if(herSl)sleeperHead(TS,true,herLook);
  if(himSl)sleeperHead(TS+32,false,himLook);
  R(TS+2,TS+16,28,14,'#ff9cbc');R(TS+2,TS+16,28,2,'#ffb8d0');R(TS+2,TS+22,28,2,'#ffb8d0');
  R(TS+34,TS+16,28,14,'#7cc4f5');R(TS+34,TS+16,28,2,'#a9dcfa');R(TS+34,TS+22,28,2,'#a9dcfa');
  ctx.fillStyle='#ffffff';ctx.font='bold 9px sans-serif';
  [[herSl,TS],[himSl,TS+32]].forEach(([on,ox])=>{if(!on)return;
    for(let i=0;i<3;i++){const ph=((t/1200)+i/3)%1;ctx.globalAlpha=1-ph;ctx.fillText('z',ox+TS*1.4+i*5+ph*6,TS*1.6-ph*18-i*2)}
    ctx.globalAlpha=1;
  });
}
function drawRoom(t){
  const off=(VH-RH)*TS/2;
  R(0,0,cv.width,cv.height,'#3a2a3f');
  ctx.save();ctx.translate(0,off);
  const now=Date.now(),mySl=S.sleepUntil>now,oSl=!!(O.has&&O.sleepUntil>now),night=isNight();
  for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){
    const ch=ROOM[y][x],px=x*TS,py=y*TS;
    if(ch==='#'){R(px,py,TS,TS,'#ffd9e6');R(px,py+TS-2,TS,2,'#f0b5c9');if(y===0)R(px,py,TS,3,'#ffc2d8')}
    else if(ch==='E'){R(px,py,TS,TS,'#efd0b3');R(px+1,py+2,14,12,'#7cc4f5');R(px+3,py+4,10,8,'#a9dcfa')}
    else R(px,py,TS,TS,(x+y)%2?'#f6dfc8':'#f0d5ba');
  }
  R(2*TS+8,5*TS-2,10*TS-16,6*TS+4,'#ff9fc0');R(2*TS+11,5*TS+1,10*TS-22,6*TS-2,'#ffd3e3');
  for(let i=0;i<4;i++)R(2*TS+16+i*28,5*TS+14,12,12,'#fff0f6');
  R(9*TS+2,3,28,13,night?'#243a6b':'#8fd6ff');R(9*TS+15,3,2,13,'#fff');R(9*TS+2,8,28,2,'#fff');
  if(night){R(9*TS+6,5,1,1,'#fff');R(9*TS+22,11,1,1,'#fff');R(9*TS+26,6,1,1,'#fff')}
  R(2*TS+2,3,28,13,night?'#243a6b':'#8fd6ff');R(2*TS+15,3,2,13,'#fff');R(2*TS+2,8,28,2,'#fff');
  R(6*TS,TS-4,32,TS+4,'#a56f4f');for(let i=0;i<4;i++)R(6*TS+2+i*7,TS-2,5,10,['#ff8fb8','#8fd0ff','#ffe36e','#a9e3a0'][i]);R(6*TS+2,TS+9,28,2,'#8a5a44');
  R(11*TS+4,TS+7,8,6,'#e6a07a');R(11*TS+3,TS,4,7,'#4caf62');R(11*TS+8,TS-2,4,9,'#5ccf72');
  R(6*TS+2,4*TS+4,28,12,'#c98f6b');R(6*TS+2,4*TS+4,28,2,'#ddab86');R(6*TS+4,4*TS+16,3,4,'#a56f4f');R(6*TS+25,4*TS+16,3,4,'#a56f4f');R(6*TS+10,4*TS,12,5,'#ffe9f1');R(6*TS+14,4*TS-2,4,3,'#ff8fb8');
  const herSl=ROLE==='her'?mySl:oSl,himSl=ROLE==='him'?mySl:oSl;
  drawBed(t,herSl,himSl,ROLE==='her'?S.look:O.look,ROLE==='him'?S.look:O.look);
  const ents=[];
  for(const k in S.hdecor){const[x,y]=k.split(',').map(Number),it=S.hdecor[k];ents.push([y*TS+(FLAT[it]?-4:0),()=>itemSprite(it,x*TS,y*TS,t,k)])}
  if(!mySl)ents.push([entY(P),()=>{drawChar(P,gSelf(),t,S.look);if(P.sit&&P.anim>=1)seatFront(P.x,P.y)}]);
  if(oVisible())ents.push([entY(O),()=>{drawChar(O,gOther(),t,O.look);if(O.sit&&O.anim>=1)seatFront(O.x,O.y)}]);
  ents.sort((p,q)=>p[0]-q[0]).forEach(e=>e[1]());
  if(!mySl){const [dx,dy]=VEC[P.dir],fx=P.x+dx,fy=P.y+dy;
    if(P.anim>=1&&ROOM[fy]&&ROOM[fy][fx]&&ROOM[fy][fx]!=='#'){ctx.strokeStyle='#f2578a';ctx.lineWidth=1;ctx.strokeRect(fx*TS+.5,fy*TS+.5,TS-1,TS-1)}}
  drawFx();
  ctx.restore();
  if(mySl){ctx.fillStyle='rgba(20,30,90,.38)';ctx.fillRect(0,0,cv.width,cv.height)}
}
function draw(t){scene==='in'?drawRoom(t):drawOutside(t)}

let last=performance.now();

window.farmSync=(d,first)=>{

/* ---------- persistent notification (media-session trick) ---------- */
(function(){
 let au=null,on=false,last=['🙂','نانا',''];
 const ms=navigator.mediaSession;
 function silentWav(){
  const rate=8000,secs=10,n=rate*secs,b=new ArrayBuffer(44+n),v=new DataView(b);
  const w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,rate,true);v.setUint32(28,rate,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
  new Uint8Array(b,44).fill(128);
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
 }
 let artCache=null;
 function art(){
  if(artCache)return artCache;
  try{
   const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
   const g=x.createLinearGradient(0,0,256,256);g.addColorStop(0,'#c2386a');g.addColorStop(1,'#1f6fb5');x.fillStyle=g;x.fillRect(0,0,256,256);
   artCache=[{src:c.toDataURL('image/png'),sizes:'256x256',type:'image/png'}];
  }catch(_){artCache=[]}
  return artCache;
 }
 function push(){
  if(!on||!ms||!window.MediaMetadata)return;
  try{
   ms.metadata=new MediaMetadata({title:last[0]+' '+last[1],artist:last[2]?'💬 '+last[2]:'دنیای ما',album:'',artwork:art()});
   try{ms.setPositionState({duration:Infinity,position:0,playbackRate:1})}catch(_){}
   ms.playbackState='playing';
  }catch(_){}
 }
 window.nanaMedia=(ic,tx,nt)=>{last=[ic,tx,nt||''];push();showN()};
 /* regular notification via service worker */
 let nOn=false;
 try{nOn=localStorage.getItem('nanaNotif')==='1'&&window.Notification&&Notification.permission==='granted'}catch(_){}
 function nIcon(ic){
  try{const c=document.createElement('canvas');c.width=c.height=192;const x=c.getContext('2d');
   x.font='150px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(ic,96,106);return c.toDataURL('image/png')}catch(_){return undefined}
 }
 async function swReg(){
  if(!('serviceWorker' in navigator))return null;
  try{await navigator.serviceWorker.register('sw.js');return await navigator.serviceWorker.ready}catch(_){return null}
 }
 async function showN(){
  if(!nOn||!window.Notification||Notification.permission!=='granted')return;
  const title=last[0]+' '+last[1],body=last[2]?'💬 '+last[2]:'دنیای ما';
  const r=await swReg();
  if(!r){try{window.__nn&&window.__nn.close();window.__nn=new Notification(title,{body,tag:'nana',silent:true,icon:nIcon(last[0]),dir:'rtl',lang:'fa'})}catch(_){}return}
  try{
   const ex=await r.getNotifications({tag:'nana'});
   if(ex.length&&ex[0].title===title&&ex[0].body===body)return;
   await r.showNotification(title,{body,tag:'nana',renotify:false,silent:true,requireInteraction:true,icon:nIcon(last[0]),dir:'rtl',lang:'fa'});
  }catch(_){}
 }
 function btn2(){const b=document.getElementById('notifBtn2');if(b)b.textContent=nOn?'🔕 خاموش کردن اعلان معمولی':'🔔 روشن کردن اعلان معمولی وضعیت نانا'}
 async function nStart(){
  if(!window.Notification||!('serviceWorker' in navigator)){alert('این مرورگر اعلان رو پشتیبانی نمی‌کنه. تو آیفون باید سایت رو Add to Home Screen کنی و از روی همون باز کنی.');return}
  let p=Notification.permission;
  if(p!=='granted')p=await Notification.requestPermission();
  if(p!=='granted'){alert('اجازه‌ی اعلان داده نشد. از تنظیمات سایت تو مرورگر روشنش کن.');return}
  const r=await swReg();
  if(!r){try{new Notification('✅ اعلان وضعیت نانا روشن شد',{silent:true})}catch(_){alert('اعلان معمولی تو گوشی به فایل sw.js هم نیاز داره. این فایل اینجا نیست، پس از «اعلان رسانه‌ای» استفاده کن که تو همین یه فایل کار می‌کنه.');return}}
  nOn=true;try{localStorage.setItem('nanaNotif','1')}catch(_){}
  btn2();showN();
 }
 async function nStop(){
  nOn=false;try{localStorage.removeItem('nanaNotif')}catch(_){}
  try{const r=await swReg();if(r)(await r.getNotifications({tag:'nana'})).forEach(n=>n.close())}catch(_){}
  btn2();
 }
 document.addEventListener('click',e=>{if(e.target&&e.target.id==='notifBtn2')nOn?nStop():nStart()});
 btn2();
 function btn(){const b=document.getElementById('notifBtn');if(b)b.textContent=on?'🔕 خاموش کردن اعلان رسانه‌ای':'🎵 روشن کردن اعلان رسانه‌ای (مثل آهنگ)'}
 async function start(){
  if(!ms||!window.MediaMetadata){alert('این مرورگر اعلان رسانه رو پشتیبانی نمی‌کنه. تو کروم اندروید یا سافاری آیفون امتحان کن.');return}
  au=au||new Audio(silentWav());au.loop=true;au.volume=1;
  try{await au.play()}catch(e){alert('پخش شروع نشد. دوباره بزن.');return}
  on=true;
  try{
   ms.setActionHandler('play',()=>{au.play();on=true;push()});
   ms.setActionHandler('pause',()=>{au.play()});
   ['previoustrack','nexttrack','seekbackward','seekforward','seekto'].forEach(a=>{try{ms.setActionHandler(a,null)}catch(_){}});
  }catch(_){}
  push();btn();
 }
 function stop(){on=false;if(au)au.pause();try{ms.metadata=null;ms.playbackState='none'}catch(_){}btn()}
 document.addEventListener('click',e=>{if(e.target&&e.target.id==='notifBtn')on?stop():start()});
})();
</script>
