<style>
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#1b2135;font-family:Vazirmatn,Tahoma,sans-serif;color:#2f3b55;touch-action:none}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(165deg,#fff,#ffeaf2 50%,#dff1ff);padding:12px}
.card{background:#ffffffdd;border-radius:22px;padding:18px 22px;width:min(420px,92vw);text-align:center;box-shadow:0 8px 24px #f2578a30}
.card h1{font-size:24px;margin-bottom:2px}.card p{font-size:13px;color:#677790;margin-bottom:10px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:11px;margin-top:8px;font:inherit;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(90deg,#f2578a,#2488d8);cursor:pointer}
.btn.alt{background:#fff;color:#2f3b55;border:1.5px solid #f0d5e0}
input{width:100%;font:inherit;border:1.5px solid #f0d5e0;border-radius:12px;padding:10px;margin-top:8px;text-align:center;direction:ltr}
#lmsg{color:#d63a5f;font-size:13px;min-height:20px;margin-top:6px}
.pick{display:flex;gap:8px;margin-top:8px}.pick button{flex:1;padding:8px;border-radius:12px;border:2px solid #f0d5e0;background:#fff;font:inherit;cursor:pointer}.pick .on{border-color:#f2578a;background:#ffeaf2}
#game{position:fixed;inset:0}
#gc{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;background:#7cc15b}
.hud{position:absolute;top:max(6px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;gap:6px;align-items:center;pointer-events:none}
.pill{background:#000a;color:#fff;border-radius:99px;padding:3px 10px;font-size:13px;pointer-events:auto;border:0;font-family:inherit}
#toast{position:absolute;top:44px;left:50%;transform:translateX(-50%);background:#000b;color:#fff;border-radius:12px;padding:6px 14px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
.pad{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:max(18px,env(safe-area-inset-left));width:150px;height:150px;display:grid;grid:"a u b""l . r""c d e"/1fr 1fr 1fr;gap:4px;direction:ltr}
.pad button{border:0;border-radius:50%;background:#ffffff88;font-size:20px;color:#2f3b55}.pad button:active{background:#fffd}
.act{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));right:max(24px,env(safe-area-inset-right));width:92px;height:92px;border-radius:50%;border:0;font:700 16px Vazirmatn;color:#fff;background:linear-gradient(135deg,#f2578a,#2488d8);box-shadow:0 4px 14px #0006}
.act:active{transform:scale(.94)}
#shop{position:absolute;inset:0;background:#0008;display:flex;align-items:center;justify-content:center}
#shop .card{max-height:90vh;overflow:auto;text-align:right;touch-action:pan-y}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f0d5e0;font-size:14px}.row span{flex:1}
.row button{border:0;border-radius:10px;padding:5px 12px;font:inherit;background:#ffeaf2;cursor:pointer}
#rot{position:fixed;inset:0;z-index:9;background:#1b2135;color:#fff;display:none;align-items:center;justify-content:center;text-align:center;font-size:18px;line-height:2}
@media (orientation:portrait){#rot{display:flex}}

.pill{background:#f6e3b8e6;color:#5a3a22;border:2px solid #8a5a3a;border-radius:10px;box-shadow:0 2px 0 #5a3a22;font-weight:700}
.joy{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:max(22px,env(safe-area-inset-left));width:128px;height:128px;border-radius:50%;background:#ffffff40;border:2px solid #ffffff80;touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:#fffd;box-shadow:0 2px 8px #0005;pointer-events:none}
.lefty .joy{left:auto;right:max(22px,env(safe-area-inset-right))}.lefty .act{right:auto;left:max(24px,env(safe-area-inset-left))}
#menu{position:absolute;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:5}
#menu .card{width:min(460px,94vw);max-height:92vh;overflow:auto;touch-action:pan-y}
.tg{border:0;border-radius:99px;padding:4px 14px;font:700 13px Vazirmatn;background:#c9b07a;color:#5a3a22}.tg.on{background:#58a85a;color:#fff}
.st{font-size:13px;line-height:2;text-align:right}
#login{background:linear-gradient(#ffd9a8,#ffb98a 45%,#7cc15b 45%,#5aa646)}
.card{background:#f6e3b8;border:3px solid #8a5a3a;box-shadow:0 6px 0 #5a3a22;color:#5a3a22}.card p{color:#7a5a3a}
.btn{background:#58a85a;box-shadow:0 3px 0 #2f6a35}.btn.alt{background:#fff6dc;color:#5a3a22;border:2px solid #8a5a3a;box-shadow:0 3px 0 #b5986a}
.row button{background:#58a85a;color:#fff;font-weight:700}
.ic{width:40px;height:40px;image-rendering:pixelated;flex:none;background:#00000010;border-radius:8px}.row{min-height:48px}

.side{position:absolute;right:max(34px,env(safe-area-inset-right));bottom:calc(max(24px,env(safe-area-inset-bottom)) + 104px);display:flex;flex-direction:column;gap:10px}
.lefty .side{right:auto;left:max(34px,env(safe-area-inset-left))}
.rb{position:relative;width:48px;height:48px;border-radius:50%;border:2px solid #8a5a3a;background:#f6e3b8;font-size:22px;box-shadow:0 3px 0 #5a3a22;padding:0}.rb:active{transform:scale(.93)}
.rb i{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#e53;color:#fff;font:700 11px Vazirmatn;line-height:18px;text-align:center;font-style:normal}
#chat{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:6px;z-index:4}
.cbox{width:min(560px,96vw);background:#f6e3b8;border:3px solid #8a5a3a;border-radius:14px;padding:8px;box-shadow:0 4px 0 #5a3a22}
#clog{max-height:26vh;overflow:auto;display:flex;flex-direction:column;gap:4px;margin-bottom:6px;touch-action:pan-y}
.m{max-width:80%;padding:4px 10px;border-radius:12px;font-size:13px;line-height:1.6;word-break:break-word;color:#3a2a22}.m.me{align-self:flex-start;background:#bfe0f5}.m.th{align-self:flex-end;background:#ffd0e0}
.crow{display:flex;gap:6px}.crow input{flex:1;margin:0;text-align:right;direction:rtl;background:#fff}.crow .btn{width:auto;margin:0;padding:8px 16px}
#pnl{position:absolute;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:3}#pnl .card{max-height:90vh;overflow:auto;text-align:right;touch-action:pan-y;width:min(460px,94vw)}
.act.hold{filter:brightness(1.3);transform:scale(.9)}
